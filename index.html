<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">

<!-- AI Crawlers & Bots Block -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noai, noimageai">
<meta name="googlebot" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<meta name="GPTBot" content="noindex">
<meta name="ChatGPT-User" content="noindex">
<meta name="OAI-SearchBot" content="noindex">
<meta name="ClaudeBot" content="noindex">
<meta name="anthropic-ai" content="noindex">
<meta name="PerplexityBot" content="noindex">
<meta name="CCBot" content="noindex">
<meta name="Bytespider" content="noindex">
<meta name="Applebot-Extended" content="noindex">
<meta name="Amazonbot" content="noindex">
<meta name="cohere-ai" content="noindex">
<meta name="meta-externalagent" content="noindex">

<meta name="theme-color" content="#070a12">
<meta name="format-detection" content="telephone=no">
<title>ViktOLK — Notice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#070a12;
  --text:#e9edf7;
  --muted:#8b94ad;
  --primary:#6d5efc;
  --primary-2:#00d4ff;
  --warn:#ffb547;
  --danger:#ff4d6d;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 18px;
  padding-top:calc(24px + var(--sat));
  padding-bottom:calc(24px + var(--sab));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  position:relative;
}

/* Ambient background */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(680px 520px at 12% 8%, rgba(255,181,71,.16), transparent 62%),
    radial-gradient(620px 520px at 92% 12%, rgba(109,94,252,.22), transparent 62%),
    radial-gradient(720px 620px at 50% 112%, rgba(255,61,129,.14), transparent 62%);
  pointer-events:none;
  z-index:0;
}

/* Warning Card */
.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:600px;
  text-align:center;
  background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.018));
  border:1px solid rgba(255,181,71,.22);
  border-radius:30px;
  padding:52px clamp(24px,5vw,52px) 44px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:
    0 34px 90px rgba(0,0,0,.6),
    0 0 70px rgba(255,181,71,.08),
    inset 0 1px 0 rgba(255,255,255,.07);
  animation:cardIn .7s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(26px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Warning icon */
.icon-ring{
  width:110px;
  height:110px;
  margin:0 auto 28px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  background:radial-gradient(circle at 50% 40%, rgba(255,181,71,.28), rgba(255,181,71,.06) 70%);
  border:1px solid rgba(255,181,71,.4);
  box-shadow:
    0 0 0 12px rgba(255,181,71,.06),
    0 0 0 24px rgba(255,181,71,.03),
    0 18px 44px rgba(255,181,71,.28);
  animation:pulse 2.6s ease-in-out infinite;
}
.icon-ring i{
  font-size:2.8rem;
  color:var(--warn);
  filter:drop-shadow(0 6px 18px rgba(255,181,71,.5));
}
@keyframes pulse{
  0%,100%{box-shadow:
    0 0 0 12px rgba(255,181,71,.06),
    0 0 0 24px rgba(255,181,71,.03),
    0 18px 44px rgba(255,181,71,.28)}
  50%{box-shadow:
    0 0 0 18px rgba(255,181,71,.09),
    0 0 0 34px rgba(255,181,71,.02),
    0 22px 54px rgba(255,181,71,.42)}
}

/* Badge */
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:#ffd39a;
  background:rgba(255,181,71,.12);
  border:1px solid rgba(255,181,71,.3);
  padding:7px 16px;
  border-radius:100px;
  margin-bottom:22px;
}

/* Title */
h1{
  font-size:clamp(1.9rem,5.6vw,2.6rem);
  font-weight:800;
  letter-spacing:-1.2px;
  line-height:1.15;
  margin-bottom:16px;
  background:linear-gradient(100deg,#ffffff 8%,#ffd39a 50%,#ff9e6d 92%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  filter:drop-shadow(0 6px 26px rgba(255,181,71,.28));
}

/* Message */
.message{
  font-size:1.05rem;
  font-weight:500;
  color:#b8c0d6;
  line-height:1.7;
  margin-bottom:10px;
  padding:0 4px;
}
.message strong{
  color:#fff;
  font-weight:700;
}

/* Divider */
.divider{
  height:1px;
  margin:28px auto 30px;
  max-width:280px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
}

/* Close button */
.btn-close{
  width:100%;
  font-family:inherit;
  font-size:1.02rem;
  font-weight:700;
  letter-spacing:.3px;
  color:#fff;
  padding:18px 22px;
  border:none;
  border-radius:17px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  background:linear-gradient(100deg,#6d5efc,#8b5cf6 42%,#00d4ff);
  background-size:210% 100%;
  background-position:0 0;
  box-shadow:0 16px 40px rgba(109,94,252,.4), inset 0 1px 0 rgba(255,255,255,.28);
  transition:background-position .45s ease, transform .22s ease, box-shadow .3s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  min-height:58px;
}
.btn-close:hover{
  background-position:100% 0;
  transform:translateY(-2px);
  box-shadow:0 22px 52px rgba(109,94,252,.55), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-close:active{transform:translateY(0) scale(.985)}
.btn-close i{font-size:1.05rem}

/* Small hint under button */
.hint{
  margin-top:16px;
  font-size:.78rem;
  font-weight:500;
  color:#6d7590;
  line-height:1.5;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
}
.hint i{color:#8b94ad;font-size:.8rem}

/* Mobile */
@media (max-width:680px){
  body{padding:18px 14px;padding-top:calc(18px + var(--sat));padding-bottom:calc(18px + var(--sab))}
  .card{padding:40px 22px 34px;border-radius:24px}
  .icon-ring{width:92px;height:92px;margin-bottom:22px}
  .icon-ring i{font-size:2.3rem}
  h1{font-size:1.95rem;letter-spacing:-.9px}
  .message{font-size:.98rem;line-height:1.65}
  .divider{margin:22px auto 24px}
  .btn-close{padding:18px 20px;font-size:1rem;border-radius:16px;min-height:60px}
}

@media (max-width:380px){
  .card{padding:34px 18px 28px}
  .icon-ring{width:80px;height:80px}
  .icon-ring i{font-size:2rem}
  h1{font-size:1.7rem}
  .message{font-size:.92rem}
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* Focus ring */
.btn-close:focus-visible{
  outline:2px solid rgba(109,94,252,.7);
  outline-offset:3px;
}
</style>
</head>
<body>

<main class="card">

  <div class="icon-ring">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>

  <div class="badge">
    <i class="fa-solid fa-circle-info"></i> Important Notice
  </div>

  <h1>Merchant Hiring is Over</h1>

  <p class="message">
    Thank you for your interest in <strong>ViktOLK</strong>.<br>
    We are no longer accepting new merchant applications.
  </p>

  <div class="divider"></div>

  <button type="button" class="btn-close" id="closeBtn">
    <i class="fa-solid fa-xmark"></i> Close
  </button>

  <p class="hint">
    <i class="fa-solid fa-heart"></i> Have a wonderful day!
  </p>

</main>

<script>
(function () {
  'use strict';

  const closeBtn = document.getElementById('closeBtn');

  closeBtn.addEventListener('click', function () {
    // Try multiple methods to close the tab/window
    try {
      window.open('', '_self', '');
      window.close();
    } catch (e) { /* ignore */ }

    // Fallback 1: try again after short delay
    setTimeout(function () {
      try { window.close(); } catch (e) { /* ignore */ }
    }, 150);

    // Fallback 2: if browser blocks closing (tab not opened by script),
    // show a friendly message
    setTimeout(function () {
      if (!document.hidden && !window.closed) {
        // Replace content with a gentle goodbye
        document.body.innerHTML = `
          <div style="
            position:fixed;inset:0;
            display:flex;align-items:center;justify-content:center;
            flex-direction:column;gap:14px;
            background:#070a12;color:#e9edf7;
            font-family:'Plus Jakarta Sans',system-ui,sans-serif;
            padding:30px;text-align:center;
          ">
            <div style="
              width:76px;height:76px;border-radius:50%;
              display:grid;place-items:center;
              background:linear-gradient(135deg,#6d5efc,#00d4ff);
              font-size:2rem;color:#fff;
              box-shadow:0 14px 40px rgba(109,94,252,.45);
            ">
              <i class="fa-solid fa-check"></i>
            </div>
            <h2 style="font-size:1.4rem;font-weight:800;margin-top:6px;">
              You may close this tab now
            </h2>
            <p style="color:#8b94ad;font-size:.95rem;max-width:320px;line-height:1.6;">
              Your browser blocked automatic closing.<br>
              Have a wonderful day! ✨
            </p>
          </div>
        `;
      }
    }, 400);
  });

  // Auto-attempt to close when user presses Escape too
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeBtn.click();
  });

})();
</script>
</body>
</html>
